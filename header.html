<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우아한수거</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .slide-down {
            animation: slideDown 0.8s ease-out forwards;
        }
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navbar-custom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 1rem 2rem;
            background: transparent;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
            margin-right: 1rem;
            position: relative;
            cursor: pointer;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .nav-buttons .btn {
            margin-left: 0.5rem;
            font-weight: 500;
        }

        /* 드롭다운 메뉴 기본 숨김 */
        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: rgba(0,0,0,0.8);
            padding: 0.5rem 0;
            border-radius: 0.25rem;
            top: 100%;
            left: 0;
            min-width: 160px;
            z-index: 1000;
        }

        /* 드롭다운 항목 스타일 */
        .dropdown-item {
            color: white;
            padding: 0.5rem 1rem;
            display: block;
            text-decoration: none;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* 서비스 소개에 마우스 올렸을 때 드롭다운 보이기 */
        .nav-item.dropdown:hover > .dropdown-menu {
            display: block;
            animation: fadeDown 0.3s ease forwards;
        }

        /* "서비스 소개" 메뉴에 화살표 추가 */
        .nav-item.dropdown > .nav-link::after {
            content: " ▼";
            font-size: 0.7rem;
            margin-left: 0.25rem;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        /* 마우스 올렸을 때 화살표 회전 */
        .nav-item.dropdown:hover > .nav-link::after {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .nav-buttons {
                margin-top: 1rem;
                text-align: center;
            }
        }

        /* 모바일 사이드바 기본 숨김 */
        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -250px; /* 화면 밖 */
            width: 250px;
            height: 100vh;
            background-color: #111;
            padding: 2rem 1rem;
            box-shadow: -2px 0 8px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 1050;
            overflow-y: auto;
        }

        /* 사이드바 열렸을 때 */
        .mobile-sidebar.open {
            right: 0;
        }

        /* 모바일 내비게이션 메뉴 */
        .mobile-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .mobile-nav-link {
            display: block;
            color: white;
            padding: 0.75rem 0;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* 드롭다운 메뉴 숨기기 */
        .mobile-dropdown-menu {
            list-style: none;
            padding-left: 1rem;
            display: none;
            margin: 0.25rem 0;
        }

        /* 드롭다운 아이템 */
        .mobile-dropdown-item {
            color: #ccc;
            padding: 0.5rem 0;
            text-decoration: none;
            display: block;
        }

        /* 드롭다운 펼침 표시 */
        .mobile-nav .dropdown.open > .mobile-dropdown-menu {
            display: block;
        }
        .custom-toggler {
            width: 40px;
            height: 30px;
            position: relative;
            cursor: pointer;
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-toggler span {
            position: absolute;
            width: 30px;
            height: 3px;
            background-color: white;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .custom-toggler span:nth-child(1) {
            top: 6px;
        }

        .custom-toggler span:nth-child(2) {
            top: 13.5px;
        }

        .custom-toggler span:nth-child(3) {
            bottom: 6px;
        }

        .custom-toggler.open span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }

        .custom-toggler.open span:nth-child(2) {
            opacity: 0;
        }

        .custom-toggler.open span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }
    </style>
</head>
<body>
<!-- 헤더 -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container d-flex align-items-center justify-content-between">
        <!-- 로고 -->
        <a class="navbar-brand" href="/index.html">우아한수거</a>

        <!-- 메뉴 + 버튼 묶음 -->
        <div class="d-none d-lg-flex align-items-center gap-4">
            <!-- 메뉴 -->
            <ul class="navbar-nav d-flex flex-row mb-0 gap-3 position-relative">
                <li class="nav-item dropdown position-relative">
                    <a class="nav-link" href="javascript:void(0)" role="button">서비스 소개</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/usage.html">이용 방법</a></li>
                        <li><a class="dropdown-item" href="/waste-items.html">수거 품목</a></li>
                        <li><a class="dropdown-item" href="/price.html">이용 요금</a></li>
                    </ul>
                </li>

            </ul>

            <!-- 버튼 -->
            <div class="nav-buttons">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfDAcm8QA1h_FkrADuA7pXuO1aqWZdHRdOro97v5AOblgzyuA/viewform?usp=header" target="_blank" class="btn btn-outline-light">서비스 신청</a>
            </div>
        </div>

        <div class="custom-toggler d-lg-none" id="mobileToggleBtn" aria-label="메뉴 열기/닫기" role="button" tabindex="0">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <!-- 모바일 사이드바 메뉴 -->
        <div id="mobileSidebar" class="mobile-sidebar" aria-hidden="true">
            <ul class="mobile-nav">
                <li class="dropdown">
                    <a href="javascript:void(0)" class="mobile-nav-link" id="mobileDropdownBtn" aria-expanded="false">서비스 소개 ▼</a>
                    <ul class="mobile-dropdown-menu" aria-labelledby="mobileDropdownBtn">
                        <li><a href="/usage.html" class="mobile-dropdown-item">이용 방법</a></li>
                        <li><a href="/waste-items.html" class="mobile-dropdown-item">수거 품목</a></li>
                        <li><a href="/price.html" class="mobile-dropdown-item">이용 요금</a></li>
                    </ul>
                </li>
                <li>
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfDAcm8QA1h_FkrADuA7pXuO1aqWZdHRdOro97v5AOblgzyuA/viewform?usp=header" target="_blank" class="btn btn-outline-light w-100 mb-2 d-block text-center">
                        서비스 신청
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 모바일 햄버거 메뉴 열고 닫기
    const mobileToggleBtn = document.getElementById('mobileToggleBtn');
    const mobileSidebar = document.getElementById('mobileSidebar');
    const mobileDropdownBtn = document.getElementById('mobileDropdownBtn');

    mobileToggleBtn.addEventListener('click', () => {
        const isOpen = mobileSidebar.classList.toggle('open');
        mobileToggleBtn.classList.toggle('open');
        mobileSidebar.setAttribute('aria-hidden', !isOpen);
        mobileToggleBtn.setAttribute('aria-expanded', isOpen);
    });

    // 키보드 접근성: Enter나 Space로도 토글 가능하게
    mobileToggleBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            mobileToggleBtn.click();
        }
    });

    // 모바일 드롭다운 메뉴 토글
    mobileDropdownBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const parentLi = mobileDropdownBtn.parentElement;
        const isOpen = parentLi.classList.toggle('open');
        mobileDropdownBtn.setAttribute('aria-expanded', isOpen);
    });
</script>
</body>
</html>
