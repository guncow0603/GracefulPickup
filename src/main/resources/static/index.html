<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우아한수거 | 메인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .fade-up {
        opacity: 0;
        animation: fadeUp 1s ease-out forwards;
    }

    .fade-up.delay-1 {
        animation-delay: 0.2s;
    }

    .fade-up.delay-2 {
        animation-delay: 0.4s;
    }

    .fade-up.delay-3 {
        animation-delay: 0.6s;
    }
    .hero {
        background: url('/images/truck.png') no-repeat center center / cover;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        padding: 0 1rem;
        position: relative;
    }
    .hero::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.4); /* 투명한 검정 */
        z-index: 1;
    }
    .hero .hero-content {
        position: relative;
        z-index: 2;
    }
    .hero .buttons .btn-primary-custom {
        padding: 0.8rem 2rem;
        font-size: 1.2rem;
        border-radius: 2rem;
        font-weight: 600;
        background-color: #ffffff;
        color: #000000;
        border: none;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
    }

    .hero .buttons .btn-primary-custom:hover {
        background-color: #f0f0f0;
        color: #333333;
        transform: translateY(-2px);
        box-shadow: 0 0.8rem 1.2rem rgba(0, 0, 0, 0.3);
    }

    .hero .buttons .btn-outline-light {
        margin-left: 1rem;
    }
</style>
<body>

<!-- 헤더 include -->
<header id="header"></header>

<!-- hero section -->
<section class="hero">
    <div class="hero-content text-white text-center">
        <h1 class="fade-up delay-1">쉽고 빠른 폐기물처리<br />복잡함 없이, 빠르고 우아하게 처리합니다</h1>
        <p class="fade-up delay-2">폐기물 처리를 새롭게 정의하다</p>
        <div class="buttons fade-up delay-3">
            <div class="buttons fade-up delay-3">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfDAcm8QA1h_FkrADuA7pXuO1aqWZdHRdOro97v5AOblgzyuA/viewform?usp=header" class="btn btn-primary-custom">
                    서비스 신청
                </a>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/header.js"></script>
</body>
</html>
